name: Byggpulsen - eget ledande index för byggandet

on:
  workflow_dispatch: {}
  # TILLFÄLLIGT för test innan merge: kör vid push till utvecklingsbranchen.
  # Tas bort innan PR:en mergas — på main triggas workflowet av rutinen.
  push:
    branches: [claude/create-synthetic-data-7mk03s]
    paths:
      - "byggpuls/*.py"
      - "byggpuls/kallor.json"
      - ".github/workflows/byggpuls.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r byggpuls/requirements.txt

      - name: Hämta serier, räkna Byggpulsen, testa i efterhand, rita grafer
        working-directory: byggpuls
        run: python hamta.py --branch "${GITHUB_REF_NAME}"

      - name: Commit data och grafer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A byggpuls/data
          git diff --cached --quiet && exit 0
          git commit -m "Auto: uppdaterad Byggpulsen"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push misslyckades (försök $i), hämtar och rebasar..."
            git pull --rebase
            sleep $((i * 3))
          done
          git push

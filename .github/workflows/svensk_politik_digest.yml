name: Svensk politik & regeringsförhandlingar - hämtning

# Ingen egen schemaläggning här. En Claude-Routine anropar det här workflowet
# via GitHub API två gånger om dagen, väntar in det och läser sedan
# svensk-politik-digest/data/ via samma API för att skriva och mejla utskicket.
# Skälet till uppdelningen: hämtningen behöver en runner med öppet nät, men
# analysen gör Claude själv och mejlet går via det kopplade Gmail-kontot -
# inga API-nycklar och inga SMTP-hemligheter i repot.
on:
  workflow_dispatch: {}

# Två körningar per dag får aldrig skriva seen.json samtidigt - då kan den ena
# köra över den andras arkiv och material skickas ut i dubbletter.
concurrency:
  group: svensk-politik-digest
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: pip install -r svensk-politik-digest/requirements.txt

      - name: Hämta nya poster
        id: fetch
        run: |
          python svensk-politik-digest/scraper.py
          new_count=$(python -c "import json;print(json.load(open('svensk-politik-digest/data/latest_articles.json'))['new_count'])")
          echo "new_count=$new_count" >> "$GITHUB_OUTPUT"
          echo "Nya poster denna körning: $new_count"

      # Läget måste checkas in, annars minns Routinen ingenting nästa gång.
      - name: Spara läget
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svensk-politik-digest/data
          if git diff --staged --quiet; then
            echo "Inget nytt att spara."
          else
            git commit -m "Politikhämtning $(date -u +%Y-%m-%d\ %H:%M) UTC (${{ steps.fetch.outputs.new_count }} nya)"
            for i in 1 2 3 4 5; do
              git push && exit 0
              echo "Push misslyckades (försök $i), hämtar och rebasar..."
              git pull --rebase
              sleep $((i * 3))
            done
            git push
          fi

name: Bostadsarkivet - nya protokoll och utredningar (månadsvis)

# Hämtar nya kammarprotokoll, propositioner, betänkanden, SOU, Ds och
# kommittédirektiv om bostadsbyggandet
# sedan förra året. Det som redan finns hoppas över. Databasen byggs inte här;
# den byggs lokalt med python bygg_db.py.
on:
  workflow_dispatch:
    inputs:
      fran:
        description: "Från år (tomt = förra året)"
        required: false
  schedule:
    - cron: "41 4 3 * *"

concurrency:
  group: bostadsarkiv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y -q poppler-utils
          pip install -r bostadsarkiv/requirements.txt
      - name: Hämta
        working-directory: bostadsarkiv
        env:
          FRAN: ${{ github.event.inputs.fran }}
        run: |
          [ -z "$FRAN" ] && FRAN=$(( $(date +%Y) - 1 ))
          python hamta.py alla --fran "$FRAN" --arbetare 3
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A bostadsarkiv/data
          git diff --cached --quiet && exit 0
          git commit -m "Auto: bostadsarkivet, nya protokoll och utredningar"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push misslyckades (försök $i), hämtar och rebasar..."
            git pull --rebase
            sleep $((i * 3))
          done
          git push

name: Diagnose SEB research site structure (temporary)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r seb-research-digest/requirements.txt

      - name: Diagnose SEB research site
        run: python seb-research-digest/diagnose.py

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Diagnose SEB research site (rendered, via headless browser)
        run: python seb-research-digest/diagnose_playwright.py

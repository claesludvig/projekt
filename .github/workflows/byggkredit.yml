name: Bygg byggkreditindikatorn

on:
  schedule:
    # Den 5:e varje månad 06:00 UTC. KRITA och finansmarknadsstatistiken
    # publiceras i slutet av föregående månad, så då finns en ny observation.
    - cron: "0 6 5 * *"
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"
    paths:
      - "byggkredit-scb/**"
      - ".github/workflows/byggkredit.yml"

jobs:
  bygg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r byggkredit-scb/requirements.txt

      - name: Verifiera beräkningslogiken
        working-directory: byggkredit-scb
        run: python tests/test_offline.py

      # Körs som eget steg och före hämtningen: landar en spec i fel tabell
      # vill man se det i loggen även om själva uttaget sedan fallerar.
      - name: Lös ut tabeller och värden (dry run)
        working-directory: byggkredit-scb
        run: python fetch.py --dry-run

      # SCB:s och KI:s tabellnamn går inte att gissa utifrån produktsidorna.
      # Trädet skrivs till en fil som committas i stället för att bara hamna i
      # körningsloggen — en committad textfil går att läsa, diffa och söka i
      # när ett mönster slutar träffa, vilket loggen från en gammal körning
      # inte gör.
      - name: Diagnostik — skriv tabellträd till fil
        if: always()
        continue-on-error: true
        working-directory: byggkredit-scb
        run: |
          {
            echo "# Tabellträd, genererat $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "## BO — boende, byggande och bebyggelse"
            python fetch.py --list BO --depth 4
            echo
            echo "## PR — priser"
            python fetch.py --list PR --depth 4
            echo
            echo "## KI — konjunkturbarometern, kvartal"
            python fetch.py --list ftgkvartal --depth 4 \
              --base https://statistik.konj.se/PxWeb/api/v1/sv/KonjBar
            echo
            echo "## KI — konjunkturbarometern, månad"
            python fetch.py --list ftgmanad --depth 4 \
              --base https://statistik.konj.se/PxWeb/api/v1/sv/KonjBar
          } > data/tabelltrad.txt 2>&1
          wc -l data/tabelltrad.txt

      - name: Hämta serier från SCB och KI
        working-directory: byggkredit-scb
        run: python fetch.py --since 2015

      - name: Beräkna indikatorer
        working-directory: byggkredit-scb
        run: python indicators.py

      - name: Rita diagram och skriv rapport
        working-directory: byggkredit-scb
        run: python report.py

      - name: Visa rapporten i körningssammanfattningen
        if: always()
        run: cat byggkredit-scb/data/rapport.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload data och diagram som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byggkredit-data
          path: byggkredit-scb/data
          retention-days: 30

      - name: Commit data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add byggkredit-scb/data
          git diff --cached --quiet && exit 0
          git commit -m "Auto: uppdaterad byggkreditindikator"
          for i in 1 2 3 4 5; do
            git push && exit 0
            # Genererad data går inte att slå ihop rad för rad. Ett rebase mot
            # en annan körnings utdata ger add/add-konflikt i samma filer, och
            # loopen fastnade där utan att någonsin komma vidare. Körningens
            # egna filer är per definition de färska, så de läggs ovanpå
            # fjärrens historik i stället för att försöka mergas med den.
            echo "Push misslyckades (försök $i), lägger om ovanpå fjärren..."
            rm -rf "$RUNNER_TEMP/data"
            cp -r byggkredit-scb/data "$RUNNER_TEMP/data"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            rm -rf byggkredit-scb/data
            cp -r "$RUNNER_TEMP/data" byggkredit-scb/data
            git add byggkredit-scb/data
            git diff --cached --quiet && exit 0
            git commit -m "Auto: uppdaterad byggkreditindikator"
            sleep $((i * 3))
          done
          git push

name: Fetch ING THINK FX & Rates digest

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ing-think-digest/requirements.txt

      - name: Fetch articles
        run: python ing-think-digest/scraper.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ing-think-digest/data
          git diff --cached --quiet || git commit -m "Auto: uppdaterad ING THINK-digest"
          git push

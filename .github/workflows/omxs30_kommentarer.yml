name: OMXS30-kommentarer

on:
  schedule:
    # Vardagar 17:30 UTC (efter stängning) - hämtar dagens kommentarer
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      steg:
        description: "Vad som ska köras"
        type: choice
        default: allt
        options:
          - allt
          - check
          - discover
          - collect

jobs:
  kommentarer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STEG: ${{ github.event.inputs.steg || 'allt' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r omxs30-kommentarer/requirements.txt

      - name: Kontrollera källor
        if: env.STEG == 'allt' || env.STEG == 'check'
        working-directory: omxs30-kommentarer
        run: python check_sources.py

      - name: Kartlägg vilka som kommenterar dagligen
        if: env.STEG == 'allt' || env.STEG == 'discover'
        working-directory: omxs30-kommentarer
        run: python discover.py --dagar 30

      - name: Hämta dagens kommentarer
        if: env.STEG == 'allt' || env.STEG == 'collect'
        working-directory: omxs30-kommentarer
        run: python collect.py --dagar 3

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add omxs30-kommentarer/data
          git diff --cached --quiet && exit 0
          git commit -m "Auto: uppdaterade OMXS30-kommentarer"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push misslyckades (försök $i), hämtar och rebasar..."
            git pull --rebase
            sleep $((i * 3))
          done
          git push

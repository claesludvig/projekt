name: Fetch OMXS30 data

on:
  schedule:
    # Vardagar 17:00 UTC (efter stängning på Stockholmsbörsen)
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r omxs30-yfinance/requirements.txt

      - name: Fetch data
        run: python omxs30-yfinance/fetch_omxs30.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add omxs30-yfinance/data
          git diff --cached --quiet || git commit -m "Auto: uppdaterad OMXS30-data"
          git push

<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sellpy-sök</title>
<style>
:root { --bg:#f7f6f3; --card:#fff; --text:#1d1d1f; --muted:#6b6b70; --line:#e2e0da; --accent:#1f6f5c; --chip:#eef4f1; }
@media (prefers-color-scheme: dark) { :root { --bg:#151517; --card:#1f1f22; --text:#ececee; --muted:#9a9aa1; --line:#33333a; --accent:#5cc2a6; --chip:#22302b; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { padding:16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
.rad { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
input, select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
input[type=search] { flex:1 1 260px; }
input.kort { width:96px; }
button { cursor:pointer; }
button.primar { background:var(--accent); color:#fff; border-color:var(--accent); }
main { display:grid; grid-template-columns:270px 1fr; gap:16px; padding:16px; max-width:1500px; margin:0 auto; }
#visafilter { display:none; }
@media (max-width:760px) { main { grid-template-columns:1fr; } #visafilter { display:inline-block; } aside:not(.oppen) { display:none; } }
aside details { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; padding:8px 12px; }
aside summary { cursor:pointer; font-weight:600; }
aside summary .valda { color:var(--accent); font-weight:400; }
.lista { max-height:260px; overflow:auto; margin-top:6px; }
.lista label { display:flex; gap:6px; font-size:14px; padding:2px 0; }
.lista label span { color:var(--muted); margin-left:auto; }
.filtsok { width:100%; margin-top:6px; padding:4px 8px; }
.matt { display:grid; grid-template-columns:1fr 64px 64px; gap:4px 6px; align-items:center; margin-top:6px; font-size:14px; }
.matt input { width:100%; padding:4px 6px; }
#status { color:var(--muted); margin:0 0 12px; }
#traffar { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.kort-annons { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
.kort-annons img { width:100%; aspect-ratio:3/4; object-fit:cover; background:var(--line); }
.kort-annons .info { padding:8px 10px; font-size:13px; }
.pris { font-weight:700; font-size:16px; }
.muted { color:var(--muted); }
.tag { display:inline-block; background:var(--chip); border-radius:6px; padding:1px 6px; margin:2px 2px 0 0; font-size:12px; }
.res { color:#c0392b; font-weight:600; }
#bevakning { display:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
#bevakning pre { white-space:pre-wrap; font-size:12px; background:var(--bg); padding:8px; border-radius:6px; }
#mer { margin:16px auto; display:none; }
</style>
</head>
<body>
<header>
  <div class="rad">
    <input type="search" id="fraga" placeholder="Sök, t.ex. levis 501, kånken, ullkappa…">
    <select id="sortering">
      <option value="nyast">Nyast först</option>
      <option value="relevans">Relevans</option>
      <option value="billigast">Billigast</option>
      <option value="dyrast">Dyrast</option>
    </select>
    <input class="kort" id="min_pris" type="number" placeholder="Min kr">
    <input class="kort" id="max_pris" type="number" placeholder="Max kr">
    <select id="dagar">
      <option value="">Alla datum</option>
      <option value="1">Senaste dygnet</option>
      <option value="3">Senaste 3 dagarna</option>
      <option value="7">Senaste veckan</option>
      <option value="30">Senaste månaden</option>
    </select>
    <label><input type="checkbox" id="snabb"> Snabb leverans</label>
    <button class="primar" id="sokknapp">Sök</button>
    <button id="rensa">Rensa</button>
    <button id="sparaknapp">Spara som bevakning</button>
    <button id="visafilter">Filter</button>
  </div>
</header>
<main>
  <aside id="filter"></aside>
  <section>
    <div id="bevakning">
      <b>Bevakning</b> — lägg in detta i <code>sellpy/bevakningar.json</code> (i listan) så kollas den automatiskt:
      <pre id="bevakningjson"></pre>
      <button id="kopiera">Kopiera</button>
    </div>
    <p id="status">Söker…</p>
    <div id="traffar"></div>
    <div class="rad"><button id="mer">Visa fler</button></div>
  </section>
</main>
<script>
// Samma publika söknyckel som sellpy.se använder i webbläsaren (se sellpy.py)
const APP = "M6WNFR0LVI", NYCKEL = "313e09c3b00b6e2da5dbe382cd1c8f4b";
const INDEX = { nyast:"prod_marketItem_se_saleStartedAt_desc", relevans:"prod_marketItem_se_relevance",
  billigast:"prod_marketItem_se_price_asc", dyrast:"prod_marketItem_se_price_desc_virtual" };
const FACETTER = [
  ["kategori","searchableExternalCategory","Kategori"], ["marke","metadata.brand","Märke"],
  ["typ","metadata.type","Typ"], ["storlek","metadata.size","Storlek"], ["skick","metadata.condition","Skick"],
  ["farg","metadata.color","Färg"], ["material","metadata.material","Material"], ["kon","metadata.demography","Kön/ålder"],
  ["monster","metadata.pattern","Mönster"], ["langd","metadata.pantsLength","Benlängd (tum)"],
  ["midjehojd","metadata.waistRise","Midjehöjd"], ["stil","style","Stil"],
];
const MATT = [["waistInCm","Midja"],["innerLegLengthInCm","Innerben"],["lengthInCm","Längd"],
  ["widthInCm","Bredd"],["heightInCm","Höjd"],["heelHeightInCm","Klackhöjd"]];
const $ = id => document.getElementById(id);
let state = { fraga:"", sortering:"nyast", filter:{}, matt:{} }, sida = 0, oppna = new Set(["kategori","marke","storlek"]);

function lasHash() {
  try { const s = JSON.parse(decodeURIComponent(location.hash.slice(1))); if (s) state = Object.assign(state, s); } catch {}
  $("fraga").value = state.fraga || ""; $("sortering").value = state.sortering || "nyast";
  $("min_pris").value = state.min_pris ?? ""; $("max_pris").value = state.max_pris ?? ""; $("dagar").value = state.dagar ?? ""; $("snabb").checked = !!state.snabb;
}
function lasFalt() {
  state.fraga = $("fraga").value.trim(); state.sortering = $("sortering").value;
  for (const k of ["min_pris","max_pris","dagar"]) { const v = $(k).value; if (v === "") delete state[k]; else state[k] = +v; }
  if ($("snabb").checked) state.snabb = true; else delete state.snabb;
}
function params(utan) {
  const facetFilters = [], numericFilters = ["price_SE.amount>0"]; // utan pris = ej till salu
  for (const [k, attr] of FACETTER) {
    const v = state.filter[k]; if (k !== utan && v && v.length) facetFilters.push(v.map(x => `${attr}:${x}`));
  }
  if (state.min_pris != null) numericFilters.push(`price_SE.amount>=${state.min_pris*100}`);
  if (state.max_pris != null) numericFilters.push(`price_SE.amount<=${state.max_pris*100}`);
  for (const [m, [lo, hi]] of Object.entries(state.matt)) {
    if (lo != null) numericFilters.push(`metadata.measurement.${m}>=${lo}`);
    if (hi != null) numericFilters.push(`metadata.measurement.${m}<=${hi}`);
  }
  if (state.snabb) facetFilters.push(["storageSite:J"]); // lagret bakom märkningen "Snabb leverans"
  if (state.dagar) numericFilters.push(`saleStartedAt>=${Date.now() - state.dagar*864e5}`);
  return { query: state.fraga || "", facetFilters, numericFilters };
}
async function algolia(requests) {
  // Nycklar som URL-parametrar och ingen egen header = "enkel" CORS-förfrågan utan preflight
  return Promise.all(requests.map(async ({ indexName, ...p }) => {
    const r = await fetch(`https://${APP}-dsn.algolia.net/1/indexes/${indexName}/query?x-algolia-application-id=${APP}&x-algolia-api-key=${NYCKEL}`,
      { method:"POST", body: JSON.stringify(p) });
    if (!r.ok) throw new Error(`Algolia ${r.status}`);
    return r.json();
  }));
}
async function sok(fler) {
  if (!fler) { sida = 0; $("traffar").innerHTML = ""; history.replaceState(null, "", "#" + encodeURIComponent(JSON.stringify(state))); }
  $("status").textContent = "Söker…";
  const huvud = { indexName: INDEX[state.sortering], ...params(), hitsPerPage: 48, page: sida,
    facets: FACETTER.map(f => f[1]).concat(MATT.map(m => "metadata.measurement." + m[0])), maxValuesPerFacet: 200 };
  // Disjunktiva facetter: för varje aktivt filter hämtas antal utan just det filtret, så man kan välja flera
  const extra = FACETTER.filter(([k]) => (state.filter[k] || []).length)
    .map(([k, attr]) => ({ indexName: INDEX.relevans, ...params(k), hitsPerPage: 0, facets: [attr], maxValuesPerFacet: 200 }));
  try {
    const [res, ...ovriga] = await algolia([huvud, ...extra]);
    const facets = { ...res.facets };
    ovriga.forEach(o => Object.assign(facets, o.facets));
    $("status").textContent = `${res.nbHits.toLocaleString("sv")} annonser`;
    visaTraffar(res.hits);
    if (!fler) visaFilter(facets, res.facets_stats || {});
    $("mer").style.display = (sida + 1) < res.nbPages ? "block" : "none";
  } catch (e) { $("status").textContent = "Fel: " + e.message; }
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const storlek = s => s ? (s.includes("-") ? s.split("-").pop() : s) : "";
function visaTraffar(hits) {
  $("traffar").insertAdjacentHTML("beforeend", hits.map(h => {
    const m = h.metadata || {}, pris = h.price_SE?.amount / 100;
    const matt = Object.entries(m.measurement || {}).map(([k, v]) => `<span class="tag">${esc(k.replace("InCm",""))} ${v} cm</span>`).join("");
    const pub = h.saleStartedAt ? new Date(h.saleStartedAt).toLocaleDateString("sv", { day:"numeric", month:"short" }) : "";
    return `<a class="kort-annons" href="https://www.sellpy.se/item/${esc(h.objectID)}" target="_blank" rel="noopener">
      <img loading="lazy" src="${esc((h.images||[])[0])}" alt="">
      <div class="info"><div class="pris">${isNaN(pris) ? "" : pris.toLocaleString("sv") + " kr"} ${h.isReserved ? '<span class="res">Reserverad</span>' : ""}</div>
      <div><b>${esc(m.brand)}</b> ${esc(m.type)} ${esc(storlek(m.size))}</div>
      ${m.model ? `<div class="muted">${esc(m.model)}</div>` : ""}
      <div class="muted">${esc(m.condition)} · ${esc((m.color||[]).join(", "))} · ${pub}</div>${matt}</div></a>`;
  }).join(""));
}
function visaFilter(facets, stats) {
  const html = FACETTER.map(([k, attr, rubrik]) => {
    const valda = state.filter[k] || [], varden = { ...facets[attr] };
    valda.forEach(v => { if (!(v in varden)) varden[v] = 0; });
    const poster = Object.entries(varden);
    if (!poster.length) return "";
    return `<details data-k="${k}" ${oppna.has(k) || valda.length ? "open" : ""}><summary>${rubrik} <span class="valda">${valda.length ? "(" + valda.length + ")" : ""}</span></summary>
      ${poster.length > 12 ? `<input class="filtsok" placeholder="Filtrera…" data-filtsok>` : ""}
      <div class="lista">${poster.map(([v, n]) => `<label><input type="checkbox" data-k="${k}" value="${esc(v)}" ${valda.includes(v) ? "checked" : ""}>${esc(v)}<span>${n}</span></label>`).join("")}</div></details>`;
  }).join("");
  const matt = MATT.filter(([m]) => stats["metadata.measurement." + m] || state.matt[m]).map(([m, namn]) => {
    const st = stats["metadata.measurement." + m] || {}, [lo, hi] = state.matt[m] || [];
    return `<span>${namn} <span class="muted">${st.min ?? ""}–${st.max ?? ""}</span></span>
      <input type="number" data-matt="${m}" data-i="0" placeholder="min" value="${lo ?? ""}"><input type="number" data-matt="${m}" data-i="1" placeholder="max" value="${hi ?? ""}">`;
  }).join("");
  $("filter").innerHTML = (matt ? `<details open><summary>Mått (cm)</summary><div class="matt">${matt}</div></details>` : "") + html;
}
$("filter").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.matt) {
    const r = state.matt[t.dataset.matt] || [null, null]; r[+t.dataset.i] = t.value === "" ? null : +t.value;
    if (r[0] == null && r[1] == null) delete state.matt[t.dataset.matt]; else state.matt[t.dataset.matt] = r;
  } else if (t.dataset.k) {
    const l = new Set(state.filter[t.dataset.k] || []); t.checked ? l.add(t.value) : l.delete(t.value);
    state.filter[t.dataset.k] = [...l];
  } else return;
  sok();
});
$("filter").addEventListener("input", e => {
  if (!("filtsok" in e.target.dataset)) return;
  const q = e.target.value.toLowerCase();
  e.target.nextElementSibling.querySelectorAll("label").forEach(l => l.style.display = l.textContent.toLowerCase().includes(q) ? "" : "none");
});
$("filter").addEventListener("toggle", e => { const k = e.target.dataset?.k; if (k) e.target.open ? oppna.add(k) : oppna.delete(k); }, true);
$("sokknapp").onclick = () => { lasFalt(); sok(); };
$("fraga").addEventListener("keydown", e => { if (e.key === "Enter") { lasFalt(); sok(); } });
for (const id of ["sortering","dagar","min_pris","max_pris","snabb"]) $(id).addEventListener("change", () => { lasFalt(); sok(); });
$("rensa").onclick = () => { state = { fraga:"", sortering:"nyast", filter:{}, matt:{} }; location.hash = ""; lasHash(); sok(); };
$("visafilter").onclick = () => $("filter").classList.toggle("oppen");
$("mer").onclick = () => { sida++; sok(true); };
$("sparaknapp").onclick = () => {
  lasFalt();
  const b = { namn: [state.fraga, ...Object.values(state.filter).flat()].filter(Boolean).join(", ") || "Min bevakning" };
  if (state.fraga) b.fraga = state.fraga;
  for (const [k, v] of Object.entries(state.filter)) if (v.length) b[k] = v;
  if (Object.keys(state.matt).length) b.matt = state.matt;
  if (state.min_pris != null) b.min_pris = state.min_pris;
  if (state.max_pris != null) b.max_pris = state.max_pris;
  if (state.snabb) b.snabb = true;
  $("bevakningjson").textContent = JSON.stringify(b, null, 2);
  $("bevakning").style.display = "block";
};
$("kopiera").onclick = () => navigator.clipboard?.writeText($("bevakningjson").textContent);
lasHash(); sok();
</script>
</body>
</html>
